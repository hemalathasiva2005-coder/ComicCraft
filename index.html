<!doctype html><html><head><meta charset="utf-8"><title>ComicCraft</title><link rel="stylesheet" href="/static/css/style.css"></head><body><main class="card"><h1>🎨 ComicCraft</h1><p>Create a 5-panel AI comic with Gemini.</p>{% if error %}<div class="error">{{ error }}</div>{% endif %}<form method="post" action="/generate"><label>Story Prompt</label><textarea name="story_prompt" required>A brave girl discovers a magical book in her school library and uses it to help her friends.</textarea><label>Main Character</label><input name="character_name" value="Ananya" required><label>Setting</label><select name="setting"><option>School</option><option>Forest</option><option>Space</option><option>City</option><option>Village</option></select><label>Tone</label><select name="tone"><option>Funny</option><option>Light-hearted</option><option>Dramatic</option><option>Poetic</option><option>Adventure</option></select><label>Art Style</label><select name="art_style"><option>Comic book</option><option>Anime</option><option>Pixel art</option><option>Realistic</option><option>Watercolor</option></select><button type="submit">✨ Generate Comic</button></form></main></body></html>
