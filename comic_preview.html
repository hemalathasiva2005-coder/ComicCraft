<!doctype html><html><head><meta charset="utf-8"><title>Comic Preview</title><link rel="stylesheet" href="/static/css/style.css"></head><body><main class="wide"><h1>📖 Comic Preview</h1>{% for p in layout %}<section class="panel"><h2>Panel {{ p.panel_number }}: {{ p.title }}</h2><img src="{{ p.image }}" alt="Panel image"><p><i>{{ p.scene_description }}</i></p><p><b>Caption:</b> {{ p.caption }}</p><p><b>Narration:</b> {{ p.narration }}</p></section>{% endfor %}<a class="button" href="{{ pdf_path }}">Download Your Comic as PDF</a> <a class="button secondary" href="/">Create Another Comic</a></main></body></html>
